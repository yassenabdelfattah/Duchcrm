<!doctype html>
<!-- lang and dir are set from the saved locale before React mounts, so the
     first paint is already right-to-left for Arabic rather than flipping. -->
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <!-- Installable as an app: the manifest for Android and desktop, and
         Apple's own tags for "Add to Home Screen" on an iPhone. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="دش" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>دش - نظام الإدارة</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // The CRM is Arabic only for now (see ARABIC_ONLY in i18n), so the
      // first paint is right-to-left whatever a browser once remembered.
      document.documentElement.lang = 'ar';
      document.documentElement.dir = 'rtl';
      // Android offers installing before the app has loaded; keep the offer
      // so the "Install app" button can use it later.
      window.addEventListener('beforeinstallprompt', function (event) {
        event.preventDefault();
        window.__duchInstallPrompt = event;
        window.dispatchEvent(new Event('duch:installable'));
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
