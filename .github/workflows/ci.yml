# Every push to master deploys the dashboard, so every push gets checked:
# the TypeScript (types, tests, a real build), the edge functions (Deno
# compile), and the database (all migrations applied to a fresh Postgres,
# then every pgTAP suite). Migrations still reach production only by a
# manual `supabase db push` - this proves they CAN apply, not that they did.
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  typescript:
    name: Types, tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  edge-functions:
    name: Edge functions compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm run functions:check

  database:
    name: Migrations and pgTAP suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Boots the local stack and applies every migration to a fresh
      # database - a migration that cannot apply fails here, not on push
      # day. Then the pgTAP suites run against it.
      - run: supabase start
      - run: supabase test db
